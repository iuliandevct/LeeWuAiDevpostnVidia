# ==============================================================================
# Cloudflare Tunnel Configuration — LeeWu AI (v1.0.0-rc1 Reconciled Architecture)
# ==============================================================================
# ARCHITECTURE BOUNDARIES:
# 1. Frontend Static Assets (Cloudflare Pages):
#    Served directly by Cloudflare Pages CDN. No tunnel required for HTML/CSS/JS.
# 2. Local Python REST API (api.leewuai.ro):
#    Exposes ONLY /api/* routes mapped to http://127.0.0.1:8080 (leewu_mvp_server.py).
#    SQLite database and Telegram Bot daemon remain strictly local and are never
#    exposed directly.
# 3. Reconciled Legacy Services (DEACTIVATED FOR SECURITY):
#    - automation.leewuai.ro (Node-RED :1880) -> REMOVED from public ingress to
#      prevent accidental exposure of administrative flow editors.
#    - n8n.leewuai.ro (n8n :5678) -> REMOVED from public ingress to prevent
#      accidental exposure of workflow automation consoles.
# ==============================================================================

tunnel: leewu-tunnel
credentials-file: /etc/cloudflared/leewu-tunnel.json

ingress:
  # 1. Python REST API Gateway — Strictly scoped to /api/* routes only
  - hostname: api.leewuai.ro
    path: ^/api/.*
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 15s
      noTLSVerify: true

  # [RECONCILED & DISABLED] Legacy Node-RED (localhost:1880) and n8n (localhost:5678)
  # administrative interfaces are intentionally excluded from public Tunnel ingress.
  # - hostname: automation.leewuai.ro (DISABLED — local-only 127.0.0.1:1880)
  # - hostname: n8n.leewuai.ro        (DISABLED — local-only 127.0.0.1:5678)

  # 2. Default Catch-All Rule (Fail-Closed HTTP 404)
  - service: http_status:404
