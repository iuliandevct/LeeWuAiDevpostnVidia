# ==============================================================================
# Cloudflare Tunnel Configuration - leewuai.ro
# LeeWu AI - Autonomous Maritime Intelligence & Survey Infrastructure
#
# REMEDIATED ARCHITECTURE:
# - Frontend (leewuai.ro, www.leewuai.ro, console.leewuai.ro):
#   Served directly by Cloudflare Pages (Anycast Edge CDN). No tunnel required.
# - Python REST API (api.leewuai.ro):
#   Mapped to local port 8080 (leewu_mvp_server.py).
# - Node-RED Field Automation (automation.leewuai.ro):
#   Mapped to local port 1880 (Node-RED runtime).
# - n8n Workflow Ingestion (n8n.leewuai.ro):
#   Mapped to local port 5678 (n8n autonomous intake).
# ==============================================================================

# Replace with your Cloudflare Tunnel UUID after creating it via:
# 'cloudflared tunnel create leewu-tunnel'
tunnel: leewu-tunnel
credentials-file: /etc/cloudflared/leewu-tunnel.json

# Edge Ingress Dispatch Matrix
ingress:
  # 1. Python REST API Gateway (Maritime Survey Intelligence MVP)
  # Corrected from 1880 -> 8080 to match leewu_mvp_server.py
  - hostname: api.leewuai.ro
    service: http://localhost:8080
    originRequest:
      connectTimeout: 15s
      noTLSVerify: true

  # 2. Node-RED Field Automation & Telegram Webhooks
  # Moved from api.leewuai.ro to dedicated automation subdomain
  - hostname: automation.leewuai.ro
    service: http://localhost:1880
    originRequest:
      connectTimeout: 10s
      noTLSVerify: true

  # 3. n8n Autonomous Workflow Intake
  - hostname: n8n.leewuai.ro
    service: http://localhost:5678
    originRequest:
      connectTimeout: 15s
      noTLSVerify: true

  # 4. Local Development Fallbacks (Optional)
  # Note: In production, leewuai.ro and www.leewuai.ro are served directly by
  # Cloudflare Pages CDN at the edge with 0ms tunnel overhead.
  - hostname: dev-local.leewuai.ro
    service: http://localhost:8080
    originRequest:
      connectTimeout: 10s
      noTLSVerify: true

  # 5. Catch-All Rule (HTTP 404)
  - service: http_status:404
